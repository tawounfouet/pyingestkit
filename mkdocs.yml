site_name: PyIngestKit
site_description: Reliable, traceable batch ingestion for Python.
site_url: https://tawounfouet.github.io/pyingestkit/
repo_url: https://github.com/tawounfouet/pyingestkit
repo_name: tawounfouet/pyingestkit
edit_uri: edit/main/docs/

exclude_docs: |
  reviews/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - Getting Started:
      - Installation 2.x: getting-started/installation.md
      - Quickstart 2.x: getting-started/quickstart.md
      - Migrate V1 to V2: guides/migrate-v1-to-v2.md
  - PyIngestKit 2.x:
      - Stable release 2.1.0: releases/v2.1.0.md
      - 2.1 stable qualification: releases/v2.1.0-qualification.md
      - 2.1 qualification evidence: releases/v2.1.0-evidence.md
      - Provider compatibility matrix: reference/provider-compatibility-v2.md
      - Historical 2.0.0 release: releases/v2.0.0.md
      - Historical 2.0 qualification: releases/v2.0.0-qualification.md
      - Historical 2.0 evidence: releases/v2.0.0-evidence.md
      - Post-2.0 scope review: roadmap/post-2.0-scope-review.md
  - Post-2.0 RFCs:
