[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyingestkit"
dynamic = ["version"]
description = "Composable ingestion tooling for Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas Awounfouet" }]
dependencies = [
  "typer>=0.27,<0.28",
  "rich>=15,<16",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-randomly>=3.15",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.8",
  "pip-audit>=2.9",
  "pre-commit>=4",
  "build>=1.2",
  "twine>=6",
]

postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
pyingest = "pyingestkit.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.dynamic]
version = {attr = "pyingestkit._version.__version__"}

[tool.setuptools.package-data]
pyingestkit = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pyingestkit"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests", "examples/plugin_package/tests"]
pythonpath = ["src", "examples/plugin_package/src"]
addopts = "-ra"
