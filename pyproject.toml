[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyingestkit"
dynamic = ["version"]
description = "Composable ingestion tooling for Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Awounfouet" }]
dependencies = [
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1.0,<2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-randomly>=3.15",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "bandit>=1.8",
  "pip-audit>=2.9",
  "pre-commit>=4",
  "build>=1.2",
  "twine>=6",
  "openpyxl>=3.1,<4",
  "pyarrow>=16,<24",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
  "SQLAlchemy>=2.0,<3",
  "httpx>=0.28.1,<1",
  "typer>=0.27,<0.28",
  "rich>=15,<16",
  "tenacity>=9.1.4,<10",
]
http = ["httpx>=0.28.1,<1"]
postgres = ["SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]
s3 = ["boto3>=1.35,<2"]
excel = ["openpyxl>=3.1,<4"]
parquet = ["pyarrow>=16,<24"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pyingestkit._version.__version__"}

[tool.setuptools.package-data]
pyingestkit = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "PYI"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pyingestkit"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests", "examples/plugin_package/tests"]
pythonpath = ["src", "examples/plugin_package/src"]
addopts = "-ra"
markers = [
  "architecture: executable architecture constraints",
  "contract: public/stable contract checks",
  "integration: integration tests requiring multiple components",
  "provider: provider-specific conformance or integration tests",
  "migration: V1 to V2 migration evidence",
  "packaging: built-artifact and clean-install checks",
  "security: security and negative-behavior checks",
  "e2e: end-to-end reference scenarios",
  "slow: intentionally slower qualification tests",
]
