name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e examples/plugin_package
      - run: python -c "import openpyxl, pyarrow; print(openpyxl.__version__, pyarrow.__version__)"
      - run: make check
      - run: make quality

  v2-architecture-baseline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install "pytest>=8"
      - name: V2 architecture contracts
        run: python -m pytest -q tests/architecture
      - name: V2 public API target contracts
        run: python -m pytest -q tests/contract/public_api
      - name: V2 core, contracts and connector conformance
        run: >-
          python -m pytest -q
          tests/unit/v2
          tests/conformance/v2
          tests/contract/public_api
      - name: Compile V2 baseline
        run: >-
          python -m compileall -q
          src/pyingestkit
          tests/architecture
          tests/contract/public_api
          tests/unit/v2
          tests/conformance/v2

  v2-package-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "build>=1.2"
      - name: Build PyIngestKit distribution
        run: python -m build
      - name: Clean wheel install and optional-provider isolation
        shell: bash
        run: |
          python -m venv /tmp/pyingestkit-v2-wheel
          /tmp/pyingestkit-v2-wheel/bin/python -m pip install --upgrade pip
          wheel="$(ls dist/pyingestkit-*.whl | head -n 1)"
          /tmp/pyingestkit-v2-wheel/bin/python -m pip install "$wheel"
          /tmp/pyingestkit-v2-wheel/bin/python - <<'PY'
          import hashlib
          import importlib.util
          import tempfile
          from pathlib import Path

          import pyingestkit
          from pyingestkit import IngestionDefinition, Source
          from pyingestkit.artifacts.v2 import ArtifactPutStatus, PutArtifactRequest
          from pyingestkit.decoders import CsvDecoder, DecodeRequest, DecodeStatus
          from pyingestkit.domain.resources import ResourceReference
          from pyingestkit.domain.runtime import CorrelationContext
          from pyingestkit.domain.shared import IngestionRunId
          from pyingestkit.integrations.pytransformkit import (
              PyTransformKitUnavailableError,
              pytransformkit_version,
          )
          from pyingestkit.sources import (
              FileAccessPolicy,
              FileSourceConnector,
              SourceRegistry,
          )
          from pyingestkit.sources.v2 import AcquisitionRequest, AcquisitionStatus
          from pyingestkit.stores import FileArtifactStore

          print("pyingestkit", pyingestkit.__version__)
          run_id = IngestionRunId.new()
          resource = ResourceReference(
              namespace="pyingestkit.resource",
              resource_id="clean-wheel-smoke",
              locator="file:///tmp/input.csv",
          )
          definition = IngestionDefinition(
              name="clean-wheel-smoke",
              source=Source.file(path="/tmp/input.csv"),
              decoder="csv",
              dataset="clean-wheel-smoke",
          )
          assert str(IngestionRunId.parse(str(run_id))) == str(run_id)
          assert resource.portable is True
          assert definition.fingerprint.algorithm == "sha256"
          assert len(definition.fingerprint.value) == 64
          assert "IngestionDefinition" not in pyingestkit.__all__

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              source_file = root / "customers.csv"
              content = b"id,name\n1,Ada\n"
              source_file.write_bytes(content)
              connector = FileSourceConnector(
                  policy=FileAccessPolicy(allowed_roots=(root,))
              )
              registry = SourceRegistry()
              registry.register(connector)
              request = AcquisitionRequest(
                  source=Source.file(path=str(source_file)),
                  ingestion_run_id=run_id,
                  correlation=CorrelationContext(
                      ingestion_run_id=str(run_id)
                  ),
              )
              result = registry.resolve(request.source).acquire(request)
              assert result.status is AcquisitionStatus.SUCCEEDED
              assert result.content == content
              assert result.checksum == hashlib.sha256(content).hexdigest()

              artifact_store = FileArtifactStore(root=root / "artifacts")
              persisted = artifact_store.put(
                  PutArtifactRequest.from_acquisition(
                      result,
                      name="customers.csv",
                  )
              )
              assert persisted.status is ArtifactPutStatus.SUCCEEDED
              assert persisted.reference is not None
              assert persisted.reference.checksum == result.checksum
              assert artifact_store.exists(persisted.reference)
              raw_bytes = artifact_store.open(persisted.reference).read()
              assert raw_bytes == content

              decoded = CsvDecoder().decode(
                  DecodeRequest(
                      ingestion_run_id=run_id,
                      correlation=request.correlation,
                      artifact=persisted.reference,
                      content=raw_bytes,
                  )
              )
              assert decoded.status is DecodeStatus.SUCCEEDED
              assert decoded.row_count == 1
              assert decoded.representation is not None
              assert decoded.representation.records[0].get("name") == "Ada"
              assert decoded.schema is not None
              assert [field.name for field in decoded.schema.fields] == ["id", "name"]

          optional = ("boto3", "openpyxl", "psycopg", "pyarrow", "pytransformkit")
          leaked = [name for name in optional if importlib.util.find_spec(name) is not None]
          if leaked:
              raise SystemExit(f"optional provider dependencies leaked into base install: {leaked}")

          try:
              pytransformkit_version()
          except PyTransformKitUnavailableError:
              pass
          else:
              raise SystemExit("PyTransformKit integration unexpectedly activated in base wheel")
          PY

  pytransformkit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install qualified PyTransformKit 1.1.0 contract
        run: >-
          python -m pip install
          "pytransformkit @ git+https://github.com/tawounfouet/pytransformkit@026f29dcb95c710912db310e94227a5c57dbd97e"
      - name: LOT-17 public interop qualification
        run: >-
          python -m pytest -q
          tests/integration/v2/test_pytransformkit_integration.py
          tests/contract/public_api/test_v2_pytransformkit.py

  postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyingestkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pyingestkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYINGEST_TEST_POSTGRES_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/pyingestkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: python -m pip install -e examples/plugin_package
      - run: >-
          python -m pytest -q
          tests/integration/test_postgres_target_copy.py
          tests/integration/test_postgres_metadata_target_loads.py
          tests/integration/test_postgres_load_modes_idempotency.py
          tests/integration/test_versioned_postgres_e2e.py
          tests/integration/v2/test_postgres_target_v2.py

  s3-e2e:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      PYINGEST_TEST_S3_ENDPOINT_URL: http://127.0.0.1:9000
      PYINGEST_TEST_S3_BUCKET: pyingestkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate ephemeral S3 test credentials
        shell: bash
        run: |
          user="ci$(python -c 'import secrets; print(secrets.token_hex(8))')"
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "AWS_ACCESS_KEY_ID=$user" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$password" >> "$GITHUB_ENV"
      - name: Start S3-compatible Moto server
        shell: bash
        run: |
          python -m pip install "moto[server]>=5.1,<6"
          moto_server -H 127.0.0.1 -p 9000 >/tmp/pyingestkit-moto-s3.log 2>&1 &
          echo $! >/tmp/pyingestkit-moto-s3.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pyingestkit-moto-s3.log
          exit 1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,s3]"
      - run: python -m pip install -e examples/plugin_package
      - run: >-
          python -m pytest -q
          tests/integration/test_s3_remote_raw.py
          tests/integration/test_s3_dataset_versions.py
          tests/integration/v2/test_s3_cross_host_replay_v2.py

  object-storage-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyingestkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pyingestkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AWS_DEFAULT_REGION: us-east-1
      PYINGEST_TEST_S3_ENDPOINT_URL: http://127.0.0.1:9000
      PYINGEST_TEST_S3_BUCKET: pyingestkit
      PYINGEST_TEST_POSTGRES_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/pyingestkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate ephemeral S3 test credentials
        shell: bash
        run: |
          user="ci$(python -c 'import secrets; print(secrets.token_hex(8))')"
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "AWS_ACCESS_KEY_ID=$user" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$password" >> "$GITHUB_ENV"
      - name: Start S3-compatible Moto server
        shell: bash
        run: |
          python -m pip install "moto[server]>=5.1,<6"
          moto_server -H 127.0.0.1 -p 9000 >/tmp/pyingestkit-moto-s3.log 2>&1 &
          echo $! >/tmp/pyingestkit-moto-s3.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pyingestkit-moto-s3.log
          exit 1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgres,s3]"
      - run: python -m pip install -e examples/plugin_package
      - name: Full cross-host object storage E2E
        run: python -m pytest -q tests/integration/test_versioned_s3_e2e.py

  foundation-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e examples/plugin_package
      - name: Stable V1 verify — tests, contracts, quality, security and build
        run: make verify
      - name: Stable V1 clean-wheel smoke
        run: make wheel-smoke
      - name: Stable V1 V0.6.0 upgrade smoke
        run: make upgrade-smoke
      - run: pyingest --version
      - run: pyingest jobs
      - name: Build SHA-256 manifest
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          paths = sorted(Path("dist").glob("*")) + sorted(Path("examples/plugin_package/dist").glob("*"))
          lines = []
          for path in paths:
              digest = sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.as_posix()}")
          Path("SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(Path("SHA256SUMS").read_text(encoding="utf-8"), end="")
          PY
      - name: Upload V1.0.0 stable source artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyingestkit-v1.0.0-source
          path: |
            .
            !.git/**
            !.pyingest/**
            !.venv/**
            !build/**
            !dist/**
            !examples/plugin_package/build/**
            !examples/plugin_package/dist/**
            !**/*.egg-info/**
            !.pytest_cache/**
            !.mypy_cache/**
            !.ruff_cache/**
            !**/__pycache__/**
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload V1.0.0 stable distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pyingestkit-v1.0.0-dist
          path: |
            dist/*
            examples/plugin_package/dist/*
            SHA256SUMS
          if-no-files-found: error

  v1-pilot-gate:
    runs-on: ubuntu-latest
    needs:
      - test
      - postgres-e2e
      - s3-e2e
      - object-storage-e2e
      - foundation-verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate V1 B2 pilot and documentation contract
        run: python scripts/check_v1_pilots.py
      - run: echo "All V1.0.0-b2 representative pilot tiers passed."

  v1-rc-history-gate:
    runs-on: ubuntu-latest
    needs:
      - v1-pilot-gate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate sealed V1 RC1 historical release contract
        run: python scripts/check_v1_rc.py
      - run: echo "Qualified V1.0.0-rc1 historical release evidence remains intact."

  stable-release-gate:
    runs-on: ubuntu-latest
    needs:
      - test
      - postgres-e2e
      - s3-e2e
      - object-storage-e2e
      - foundation-verify
      - v1-pilot-gate
      - v1-rc-history-gate
      - v2-architecture-baseline
      - v2-package-baseline
      - pytransformkit-integration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Validate V1.0.0 stable release contract
        run: python scripts/check_v1_stable.py
      - run: echo "All V1.0.0 stable qualification tiers passed."
