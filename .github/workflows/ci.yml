    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.0.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Validate immutable V1 stable historical contract
        run: python scripts/check_v1_stable.py
      - run: echo "V1.0.0 historical release evidence remains sealed on tag v1.0.0."

