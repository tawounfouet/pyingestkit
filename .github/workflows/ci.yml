name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e examples/plugin_package
      - run: make check
      - run: make quality

  foundation-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e examples/plugin_package
      - run: make verify
      - run: make wheel-smoke
      - run: pyingest --version
      - run: pyingest jobs
      - run: pyingest run demo.local_file --config examples/plugin_package/demo.yml
      - run: pyingest run demo.http_csv --config examples/plugin_package/demo-http.yml
      - run: pyingest run demo.http_json --config examples/plugin_package/demo-http.yml
      - run: pyingest runs
