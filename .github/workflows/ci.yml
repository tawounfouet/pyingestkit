  stable-artifact-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: V2 current release-line check
        run: make release-check
      - name: Validate frozen 2.0 compatibility baseline
        run: python scripts/check_v2_compatibility.py
      - name: Validate LOT-29 RC milestone contract
        run: python scripts/check_v2_1_rc1.py
      - name: Build SHA-256 manifest
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          paths = sorted(Path("dist").glob("*"))
          lines = [f"{sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}" for path in paths]
          Path("SHA256SUMS-v2.1.0rc1").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          print(Path("SHA256SUMS-v2.1.0rc1").read_text(encoding="utf-8"), end="")
          PY
      - name: Upload V2 stable distribution evidence
        uses: actions/upload-artifact@v7
        with:
          name: pyingestkit-v2.1.0rc1-dist
          path: |
            dist/*
            SHA256SUMS-v2.1.0rc1
          if-no-files-found: error

  v1-history-gate:
