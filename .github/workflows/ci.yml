  s3-e2e:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      PYINGEST_TEST_S3_ENDPOINT_URL: http://127.0.0.1:9000
      PYINGEST_TEST_S3_BUCKET: pyingestkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate ephemeral S3 test credentials
        shell: bash
        run: |
          user="ci$(python -c 'import secrets; print(secrets.token_hex(8))')"
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "AWS_ACCESS_KEY_ID=$user" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$password" >> "$GITHUB_ENV"
      - name: Start S3-compatible Moto server
        shell: bash
        run: |
          python -m pip install "moto[server]>=5.1,<6"
          moto_server -H 127.0.0.1 -p 9000 >/tmp/pyingestkit-moto-s3.log 2>&1 &
          echo $! >/tmp/pyingestkit-moto-s3.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pyingestkit-moto-s3.log
          exit 1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,s3]"
      - name: V2 S3 cross-host replay qualification
        run: python -m pytest -q tests/integration/v2/test_s3_cross_host_replay_v2.py

