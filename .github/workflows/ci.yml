  governance-built-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "build>=1.2"
      - run: python -m build
      - name: Clean base wheel source distribution and provider extras
        shell: bash
        run: |
          wheel="$(ls dist/pyingestkit-*.whl | head -n 1)"
          sdist="$(ls dist/pyingestkit-*.tar.gz | head -n 1)"

          python -m venv /tmp/pyingestkit-rc-base
          /tmp/pyingestkit-rc-base/bin/python -m pip install --upgrade pip
          /tmp/pyingestkit-rc-base/bin/python -m pip install "$wheel"
          /tmp/pyingestkit-rc-base/bin/python - <<'PY'
          import importlib.util
          import pyingestkit

          assert pyingestkit.__version__ == "2.1.0rc1"
          assert len(pyingestkit.__all__) == 11
          for dependency in ("boto3", "psycopg", "sqlalchemy"):
              assert importlib.util.find_spec(dependency) is None
          PY

          python -m venv /tmp/pyingestkit-rc-postgres
          /tmp/pyingestkit-rc-postgres/bin/python -m pip install --upgrade pip
          /tmp/pyingestkit-rc-postgres/bin/python -m pip install "$wheel[postgres]"
          /tmp/pyingestkit-rc-postgres/bin/python - <<'PY'
          import importlib.util
          import pyingestkit
          from pyingestkit.adapters.postgres import PostgresPublicationLedger

          assert pyingestkit.__version__ == "2.1.0rc1"
          assert len(pyingestkit.__all__) == 11
          assert PostgresPublicationLedger.__name__ == "PostgresPublicationLedger"
          assert importlib.util.find_spec("psycopg") is not None
          assert importlib.util.find_spec("sqlalchemy") is not None
          PY

          python -m venv /tmp/pyingestkit-rc-s3
          /tmp/pyingestkit-rc-s3/bin/python -m pip install --upgrade pip
          /tmp/pyingestkit-rc-s3/bin/python -m pip install "$wheel[s3]"
          /tmp/pyingestkit-rc-s3/bin/python - <<'PY'
          import importlib.util
          import pyingestkit
          from pyingestkit.adapters.s3 import S3ConditionalDatasetPublisher

          assert pyingestkit.__version__ == "2.1.0rc1"
          assert len(pyingestkit.__all__) == 11
          assert S3ConditionalDatasetPublisher.__name__ == "S3ConditionalDatasetPublisher"
          assert importlib.util.find_spec("boto3") is not None
          PY

          python -m venv /tmp/pyingestkit-rc-sdist
          /tmp/pyingestkit-rc-sdist/bin/python -m pip install --upgrade pip
          /tmp/pyingestkit-rc-sdist/bin/python -m pip install "$sdist"
          /tmp/pyingestkit-rc-sdist/bin/python - <<'PY'
          import pyingestkit

          assert pyingestkit.__version__ == "2.1.0rc1"
          assert len(pyingestkit.__all__) == 11
          PY

