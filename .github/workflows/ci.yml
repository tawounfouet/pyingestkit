name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: V2 stable test matrix
        run: make check-v2
      - name: V2 stable quality
        run: make quality
      - name: Frozen PyIngestKit 2.0 compatibility
        run: python scripts/check_v2_compatibility.py
      - name: Current PyIngestKit V2 milestone contract
        run: python scripts/check_v2_1_rc1.py

  v2-architecture-baseline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[http,postgres,s3]"
      - run: python -m pip install "pytest>=8"
      - name: V2 architecture contracts
        run: python -m pytest -q tests/architecture
      - name: V2 public API target contracts
        run: python -m pytest -q tests/contract/public_api
      - name: V2 core, contracts and connector conformance
        run: >-
          python -m pytest -q
          tests/unit/v2
          tests/conformance/v2
          tests/contract/public_api
      - name: Compile V2 baseline
        run: >-
          python -m compileall -q
          src/pyingestkit
          tests/architecture
          tests/contract/public_api
          tests/unit/v2
          tests/conformance/v2

  v2-package-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "build>=1.2"
      - name: Build PyIngestKit distribution
        run: python -m build
      - name: Clean wheel install and optional-provider isolation
        shell: bash
        run: |
          python -m venv /tmp/pyingestkit-v2-wheel
          /tmp/pyingestkit-v2-wheel/bin/python -m pip install --upgrade pip
          wheel="$(ls dist/pyingestkit-*.whl | head -n 1)"
          /tmp/pyingestkit-v2-wheel/bin/python -m pip install "$wheel"
          /tmp/pyingestkit-v2-wheel/bin/python - <<'PY'
          import hashlib
          import importlib.util
          import tempfile
          from pathlib import Path

          import pyingestkit
          from pyingestkit import IngestionDefinition, Source
          from pyingestkit.adapters.memory import MemoryPublicationLedger
          from pyingestkit.artifacts.v2 import ArtifactPutStatus, PutArtifactRequest
          from pyingestkit.decoders import CsvDecoder, DecodeRequest, DecodeStatus
          from pyingestkit.domain.resources import ResourceReference
          from pyingestkit.domain.runtime import CorrelationContext
          from pyingestkit.domain.shared import IngestionRunId
          from pyingestkit.governance.retention import RetentionPlanner
          from pyingestkit.governance.rollback import GovernedRollbackService
          from pyingestkit.integrations.pytransformkit import (
              PyTransformKitUnavailableError,
              pytransformkit_version,
          )
          from pyingestkit.sources import (
              FileAccessPolicy,
              FileSourceConnector,
              SourceRegistry,
          )
          from pyingestkit.sources.v2 import AcquisitionRequest, AcquisitionStatus
          from pyingestkit.stores import FileArtifactStore

          print("pyingestkit", pyingestkit.__version__)
          run_id = IngestionRunId.new()
          resource = ResourceReference(
              namespace="pyingestkit.resource",
              resource_id="clean-wheel-smoke",
              locator="file:///tmp/input.csv",
          )
          definition = IngestionDefinition(
              name="clean-wheel-smoke",
              source=Source.file(path="/tmp/input.csv"),
              decoder="csv",
              dataset="clean-wheel-smoke",
          )
          assert str(IngestionRunId.parse(str(run_id))) == str(run_id)
          assert resource.portable is True
          assert definition.fingerprint.algorithm == "sha256"
          assert len(definition.fingerprint.value) == 64
          assert tuple(pyingestkit.__all__) == (
              "ArtifactReference",
              "DatasetVersion",
              "DatasetVersionReference",
              "IngestionDefinition",
              "IngestionResult",
              "IngestionRun",
              "IngestionRunId",
              "IngestionRuntime",
              "PublishedDataset",
              "ResourceReference",
              "Source",
          )
          assert pyingestkit.__version__ == "2.1.0rc1"
          assert hasattr(pyingestkit.IngestionRuntime, "run")
          import pyingestkit.governance as governance
          assert "PublicationLedger" in governance.__all__
          assert "ConditionalDatasetPublisher" in governance.__all__
          assert MemoryPublicationLedger().__class__.__name__ == "MemoryPublicationLedger"
          assert RetentionPlanner.__module__ == "pyingestkit.governance.retention"
          assert GovernedRollbackService.__module__ == "pyingestkit.governance.rollback"

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              source_file = root / "customers.csv"
              content = b"id,name\n1,Ada\n"
              source_file.write_bytes(content)
              connector = FileSourceConnector(
                  policy=FileAccessPolicy(allowed_roots=(root,))
              )
              registry = SourceRegistry()
              registry.register(connector)
              request = AcquisitionRequest(
                  source=Source.file(path=str(source_file)),
                  ingestion_run_id=run_id,
                  correlation=CorrelationContext(
                      ingestion_run_id=str(run_id)
                  ),
              )
              result = registry.resolve(request.source).acquire(request)
              assert result.status is AcquisitionStatus.SUCCEEDED
              assert result.content == content
              assert result.checksum == hashlib.sha256(content).hexdigest()

              artifact_store = FileArtifactStore(root=root / "artifacts")
              persisted = artifact_store.put(
                  PutArtifactRequest.from_acquisition(
                      result,
                      name="customers.csv",
                  )
              )
              assert persisted.status is ArtifactPutStatus.SUCCEEDED
              assert persisted.reference is not None
              assert persisted.reference.checksum == result.checksum
              assert artifact_store.exists(persisted.reference)
              raw_bytes = artifact_store.open(persisted.reference).read()
              assert raw_bytes == content

              decoded = CsvDecoder().decode(
                  DecodeRequest(
                      ingestion_run_id=run_id,
                      correlation=request.correlation,
                      artifact=persisted.reference,
                      content=raw_bytes,
                  )
              )
              assert decoded.status is DecodeStatus.SUCCEEDED
              assert decoded.row_count == 1
              assert decoded.representation is not None
              assert decoded.representation.records[0].get("name") == "Ada"
              assert decoded.schema is not None
              assert [field.name for field in decoded.schema.fields] == ["id", "name"]

          optional = (
              "boto3",
              "httpx",
              "openpyxl",
              "psycopg",
              "pyarrow",
              "pytransformkit",
              "sqlalchemy",
          )
          leaked = [name for name in optional if importlib.util.find_spec(name) is not None]
          if leaked:
              raise SystemExit(f"optional provider dependencies leaked into base install: {leaked}")

          try:
              pytransformkit_version()
          except PyTransformKitUnavailableError:
              pass
          else:
              raise SystemExit("PyTransformKit integration unexpectedly activated in base wheel")
          PY
      - name: Clean source-distribution install
        shell: bash
        run: |
          python -m venv /tmp/pyingestkit-v2-sdist
          /tmp/pyingestkit-v2-sdist/bin/python -m pip install --upgrade pip
          sdist="$(ls dist/pyingestkit-*.tar.gz | head -n 1)"
          /tmp/pyingestkit-v2-sdist/bin/python -m pip install "$sdist"
          /tmp/pyingestkit-v2-sdist/bin/python - <<'PY'
          import pyingestkit

          assert pyingestkit.__version__ == "2.1.0rc1"
          assert tuple(pyingestkit.__all__) == (
              "ArtifactReference",
              "DatasetVersion",
              "DatasetVersionReference",
              "IngestionDefinition",
              "IngestionResult",
              "IngestionRun",
              "IngestionRunId",
              "IngestionRuntime",
              "PublishedDataset",
              "ResourceReference",
              "Source",
          )
          assert hasattr(pyingestkit.IngestionRuntime, "run")
          print("sdist", pyingestkit.__version__)
          PY

  pytransformkit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install qualified PyTransformKit 1.1.0 contract
        run: >-
          python -m pip install
          "pytransformkit @ git+https://github.com/tawounfouet/pytransformkit@026f29dcb95c710912db310e94227a5c57dbd97e"
      - name: LOT-17 public interop qualification
        run: >-
          python -m pytest -q
          tests/integration/v2/test_pytransformkit_integration.py
          tests/contract/public_api/test_v2_pytransformkit.py

  customer360-built-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: Build PyIngestKit wheel
        run: python -m build --wheel
      - name: Create clean Customer 360 environment
        run: python -m venv .venv-customer360
      - name: Install built PyIngestKit wheel
        run: >-
          .venv-customer360/bin/python -m pip install
          --upgrade pip pytest dist/*.whl
      - name: Install qualified PyTransformKit Customer 360 profile
        run: >-
          .venv-customer360/bin/python -m pip install
          "pytransformkit[pandas,polars,io] @
          git+https://github.com/tawounfouet/pytransformkit@026f29dcb95c710912db310e94227a5c57dbd97e"
      - name: Customer 360 installed-package qualification
        run: >-
          .venv-customer360/bin/python -m pytest -q
          tests/integration/v2/test_customer_360_e2e.py
      - name: Customer 360 installed runner smoke
