name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e examples/plugin_package
      - run: python -c "import openpyxl, pyarrow; print(openpyxl.__version__, pyarrow.__version__)"
      - run: make check
      - run: make quality

  postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyingestkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pyingestkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYINGEST_TEST_POSTGRES_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/pyingestkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: python -m pip install -e examples/plugin_package
      - run: >-
          python -m pytest -q
          tests/integration/test_postgres_target_copy.py
          tests/integration/test_postgres_metadata_target_loads.py
          tests/integration/test_postgres_load_modes_idempotency.py
          tests/integration/test_versioned_postgres_e2e.py

  foundation-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e examples/plugin_package
      - name: Release gate — tests and public API
        run: make check
      - name: Release gate — quality
        run: make quality
      - name: Release gate — security
        run: make security
      - name: Release gate — build distributions
        run: make build
      - name: Release gate — wheel smoke
        run: |
          set -o pipefail
          make wheel-smoke 2>&1 | tee wheel-smoke.log
      - name: Upload wheel-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyingestkit-v0.5.0-rc1-wheel-smoke-diagnostics
          path: wheel-smoke.log
          if-no-files-found: ignore
      - run: pyingest --version
      - run: pyingest jobs
      - run: pyingest run demo.local_file --config examples/plugin_package/demo.yml
      - run: pyingest run demo.http_csv --config examples/plugin_package/demo-http.yml
      - run: pyingest run demo.http_json --config examples/plugin_package/demo-http.yml
      - run: pyingest run demo.ndjson_quality --config examples/plugin_package/demo-quality.yml
      - run: pyingest run demo.excel_quality --config examples/plugin_package/demo-quality.yml
      - run: pyingest run demo.parquet_quality --config examples/plugin_package/demo-quality.yml
      - run: pyingest runs
      - name: Upload V0.5.0-rc1 PostgreSQL full E2E artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyingestkit-v0.5.0-rc1-postgres-e2e
          path: |
            .
            !.git/**
            !.pyingest/**
            !.venv/**
            !build/**
            !dist/**
            !examples/plugin_package/build/**
            !examples/plugin_package/dist/**
            !**/*.egg-info/**
            !.pytest_cache/**
            !.mypy_cache/**
            !.ruff_cache/**
            !**/__pycache__/**
          include-hidden-files: true
          if-no-files-found: error
