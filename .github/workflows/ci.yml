  postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyingestkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pyingestkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYINGEST_TEST_POSTGRES_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/pyingestkit
    steps:
