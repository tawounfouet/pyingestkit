[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyingestkit-demo-jobs"
version = "0.1.0"
description = "Installable demonstration job pack for PyIngestKit."
requires-python = ">=3.11"
dependencies = [
  "pyingestkit>=0.1.5,<0.2",
]

[project.entry-points."pyingestkit.jobs"]
demo-local-file = "pyingestkit_demo_jobs.local_file:job_definition"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
